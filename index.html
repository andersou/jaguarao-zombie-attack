<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Jaguarão Zombie Attack</title>
		<!-- iOS Home Screen mode, no manifest and no service worker (docs/mobile-touch-plan.md A5, D23) -->
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="Zombie Attack">
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
	/* a long press on a touch button must not select or open a callout */
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Loading screen in the game's plaque style: the splash, then a bar with the phase and percentage. */
#status {
	position: absolute;
	inset: 0;
	background-color: #0c1220;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 2vh;
	visibility: hidden;
	color: #ece4d2;
	font-family: 'Avenir Next Condensed', 'Bahnschrift', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
}

#status-splash {
	height: 68vh;
	max-width: 94vw;
	object-fit: contain;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	width: min(560px, 80vw);
}

#status-label {
	display: flex;
	justify-content: space-between;
	font-size: 15px;
	font-weight: 700;
	letter-spacing: 0.12em;
	text-transform: uppercase;
	margin-bottom: 8px;
}

#status-pct {
	color: #e3a13c;
}

#status-track {
	height: 12px;
	border: 2px solid rgba(236, 228, 210, 0.55);
	border-radius: 5px;
	background: #17243a;
	overflow: hidden;
	position: relative;
}

#status-fill {
	height: 100%;
	width: 0;
	background: #e3a13c;
	transition: width 0.25s ease-out;
}

/* Indeterminate stripe while the engine starts and the city loads: a transform animation keeps moving
   even while the page's main thread is busy loading. */
#status-track.busy #status-fill {
	width: 30%;
	transition: none;
	animation: busy 1.1s ease-in-out infinite;
}

@keyframes busy {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#status-hint {
	margin-top: 10px;
	font-size: 14px;
	color: rgba(236, 228, 210, 0.62);
	text-align: center;
	min-height: 1.2em;
}

/* Phones are landscape only (D19): this covers the page in portrait, during the download too.
   The game pauses itself as well; this is what the player sees. */
#rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 10;
	background-color: #0c1220;
	color: #ece4d2;
	font-family: 'Avenir Next Condensed', 'Bahnschrift', 'Roboto Condensed', 'Arial Narrow', Arial, sans-serif;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 18px;
	text-align: center;
}

#rotate div {
	font-size: 26px;
	font-weight: 700;
	letter-spacing: 0.12em;
	text-transform: uppercase;
}

#rotate p {
	margin: 0 2rem;
	font-size: 16px;
	color: rgba(236, 228, 210, 0.62);
}

#rotate svg {
	width: 84px;
	height: 84px;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate {
		display: flex;
	}
}

/* ?probe: what the T0 probe on a phone needs to read without a remote inspector */
#probe {
	position: fixed;
	left: 4px;
	top: 4px;
	z-index: 20;
	max-width: 70vw;
	max-height: 90vh;
	overflow: hidden;
	padding: 6px 8px;
	background: rgba(0, 0, 0, 0.72);
	color: #9cc487;
	font: 11px/1.35 ui-monospace, Menlo, monospace;
	white-space: pre-wrap;
	pointer-events: none;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="rotate">
			<svg viewBox="0 0 64 64" fill="none" stroke="#e3a13c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
				<rect x="22" y="6" width="20" height="36" rx="3"/>
				<path d="M10 50 a24 24 0 0 0 40 4"/>
				<path d="M50 46 v8 h-8"/>
			</svg>
			<div>Gire o aparelho</div>
			<p>O jogo é jogado com o celular deitado.</p>
		</div>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<div id="status-progress">
				<div id="status-label"><span id="status-phase">Baixando o jogo</span><span id="status-pct"></span></div>
				<div id="status-track"><div id="status-fill"></div></div>
				<div id="status-hint"></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17627072,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// ?probe (T0 of docs/mobile-touch-plan.md): device facts, live touches and the game's PROBE lines on screen.
if (/[?&]probe(&|=|$)/.test(location.search)) {
	const box = document.createElement('div');
	box.id = 'probe';
	document.body.appendChild(box);
	const lines = [];
	const log = (text) => {
		lines.push(text);
		lines.splice(0, Math.max(0, lines.length - 14));
		render();
	};
	function facts() {
		const mq = (q) => window.matchMedia(q).matches;
		return [
			`inner ${innerWidth}x${innerHeight}  screen ${screen.width}x${screen.height}  dpr ${devicePixelRatio}`,
			`orientation ${(screen.orientation || {}).type || window.orientation}`,
			`standalone ${navigator.standalone} display-mode:standalone ${mq('(display-mode: standalone)')}`,
			`pointer:coarse ${mq('(pointer: coarse)')} hover:none ${mq('(hover: none)')} maxTouchPoints ${navigator.maxTouchPoints}`,
			`fullscreenEnabled ${document.fullscreenEnabled} webkitFullscreenEnabled ${document.webkitFullscreenEnabled}`,
			`orientation.lock ${typeof (screen.orientation || {}).lock} visibility ${document.visibilityState}`,
			`${navigator.userAgent}`,
		];
	}
	function render() {
		box.textContent = facts().concat(['--'], lines).join('\n');
	}
	const touches = (e) => log(`${e.type} [${Array.from(e.touches).map((t) => `${t.identifier}@${Math.round(t.clientX)},${Math.round(t.clientY)}`).join(' ')}]`);
	['touchstart', 'touchend', 'touchcancel'].forEach((t) => window.addEventListener(t, touches, { passive: true, capture: true }));
	['resize', 'orientationchange', 'visibilitychange', 'pagehide', 'pageshow'].forEach((t) => window.addEventListener(t, () => log(t)));
	const consoleLog = console.log;
	console.log = (...args) => {
		consoleLog.apply(console, args);
		const text = args.join(' ');
		if (text.startsWith('PROBE')) {
			log(text);
		}
	};
	render();
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		const phase = document.getElementById('status-phase');
		const pct = document.getElementById('status-pct');
		const track = document.getElementById('status-track');
		const fill = document.getElementById('status-fill');
		const hint = document.getElementById('status-hint');
		function busy(text, sub) {
			phase.textContent = text;
			pct.textContent = '';
			track.classList.add('busy');
			hint.textContent = sub;
		}
		if (window.matchMedia('(pointer: coarse)').matches) {
			hint.textContent = 'Cerca de 32 MB de download. Prefira Wi-Fi.';
		}
		// The game calls window.jzaReady() once the city is built (main.gd); until then keep the plaque up.
		let cityReady = false;
		window.jzaReady = () => {
			cityReady = true;
			if (statusMode === 'progress' && track.classList.contains('busy')) {
				setStatusMode('hidden');
			}
		};
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0 && current < total) {
					track.classList.remove('busy');
					fill.style.width = (100 * current / total).toFixed(1) + '%';
					pct.textContent = Math.floor(100 * current / total) + '%';
				} else if (current >= total && total > 0) {
					busy('Iniciando o motor', '');
				}
			},
		}).then(() => {
			if (cityReady) {
				setStatusMode('hidden');
				return;
			}
			busy('Preparando a cidade', 'Pode levar alguns segundos.');
			setTimeout(() => setStatusMode('hidden'), 120000);   // never trap the page behind the plaque
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
